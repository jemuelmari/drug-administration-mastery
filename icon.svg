<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A5276"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
    <linearGradient id="syringeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="60" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="440" cy="440" r="80" fill="#FFFFFF" opacity="0.06"/>

  <!-- Pill capsule (diagonal) -->
  <g transform="translate(256, 210) rotate(-30)">
    <rect x="-95" y="-38" width="190" height="76" rx="38" ry="38" fill="url(#pillGrad)" stroke="#0E2F44" stroke-width="4"/>
    <path d="M 0,-38 L 0,38" stroke="#0E2F44" stroke-width="4"/>
    <rect x="-95" y="-38" width="95" height="76" rx="38" ry="0" fill="#FFCDD2"/>
    <path d="M -95,0 L -95,-38 L 0,-38 L 0,38 L -95,38 Z" fill="#FFCDD2" opacity="0.9"/>
    <rect x="-95" y="-38" width="190" height="76" rx="38" ry="38" fill="none" stroke="#0E2F44" stroke-width="4"/>
    <path d="M 0,-38 L 0,38" stroke="#0E2F44" stroke-width="4"/>
  </g>

  <!-- Syringe -->
  <g transform="translate(330, 330) rotate(45)">
    <rect x="-60" y="-16" width="120" height="32" rx="4" fill="url(#syringeGrad)" stroke="#0E2F44" stroke-width="3"/>
    <rect x="-60" y="-16" width="30" height="32" fill="#FFFFFF" opacity="0.7"/>
    <rect x="60" y="-6" width="30" height="12" fill="#90A4AE" stroke="#0E2F44" stroke-width="2"/>
    <rect x="-70" y="-20" width="12" height="40" rx="2" fill="#607D8B" stroke="#0E2F44" stroke-width="2"/>
    <rect x="-90" y="-4" width="20" height="8" fill="#607D8B" stroke="#0E2F44" stroke-width="2"/>
    <line x1="-55" y1="-10" x2="40" y2="-10" stroke="#0E2F44" stroke-width="1.5" opacity="0.4"/>
    <line x1="-55" y1="0" x2="40" y2="0" stroke="#0E2F44" stroke-width="1.5" opacity="0.4"/>
    <line x1="-55" y1="10" x2="40" y2="10" stroke="#0E2F44" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Safety shield (bottom center) -->
  <g transform="translate(180, 400)">
    <path d="M 0,-40 L 55,-25 L 55,20 C 55,50 25,65 0,75 C -25,65 -55,50 -55,20 L -55,-25 Z"
          fill="url(#shieldGrad)" stroke="#0E2F44" stroke-width="4"/>
    <path d="M -22,10 L -6,26 L 24,-8"
          fill="none" stroke="#FFFFFF" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small cross -->
  <g transform="translate(360, 130)">
    <rect x="-8" y="-24" width="16" height="48" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="-24" y="-8" width="48" height="16" rx="3" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
